name: go

# Format, vet, lint, race tests and a vulnerability scan. Runs on pull requests,
# and on main through docker.yml, which calls this workflow before publishing.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # install-only puts golangci-lint on PATH so `make check` is the one place it runs.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9.0
          install-only: true

      - run: make check

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  integration:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        # Keep in step with docker-compose.yml.
        image: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # GitHub has no readiness check for this image; any HTTP reply (DynamoDB answers a
      # bare GET with 400) means it is accepting connections.
      - name: Wait for DynamoDB Local
        run: timeout 60 sh -c 'until curl -s -o /dev/null http://localhost:8000; do sleep 1; done'

      - run: make test-integration
