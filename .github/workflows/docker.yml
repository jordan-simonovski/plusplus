name: docker

# Build and publish the container image to GitHub Container Registry on every
# push to main. The image is tagged with the short commit SHA and `latest`, and
# is built for both linux/amd64 and linux/arm64. The package.json version tag is
# only pushed by the first build of that version (the release merge), so a
# pinned `X.Y.Z` always points at the release and is never overwritten.
on:
  push:
    branches: [main]
    # The image only depends on Go source, go.mod, package.json, and the
    # Dockerfile. Skip rebuilds for changes that cannot affect the binary.
    paths-ignore:
      - "docs/**"
      - "landing/**"
      - "terraform/**"
      - "README.md"
      - ".changeset/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go:
    uses: ./.github/workflows/go.yml

  build:
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ponytail: any inspect failure (not just "not found") counts as unpublished,
      # so a registry hiccup re-pushes the version tag; fail-closed check if that bites.
      - name: Check whether this version is already published
        id: published
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}:${{ steps.version.outputs.version }}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.published.outputs.exists == 'false' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
