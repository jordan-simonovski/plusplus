name: release-check

# Dry-runs the release workflow's version step on pull requests, so a change that stops
# releases (a Changesets upgrade, a config change) fails here instead of after merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  version-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          HUSKY: "0"

      # With pending changesets, `npm run release` must bump the version and consume them.
      - name: Dry-run npm run release
        run: |
          pending=$(ls .changeset/*.md | grep -vc '/README\.md$' || true)
          # Nothing to release: changeset version exits 1 ("No unreleased changesets found").
          if [ "$pending" -eq 0 ]; then
            echo "No pending changesets; nothing to dry-run."
            exit 0
          fi
          before=$(node -p "require('./package.json').version")
          npm run release
          after=$(node -p "require('./package.json').version")
          left=$(ls .changeset/*.md | grep -vc '/README\.md$' || true)
          echo "pending changesets: $pending, version: $before -> $after, left: $left"
          if [ "$before" = "$after" ] || [ "$left" -ne 0 ]; then
            echo "::error::npm run release did not consume the pending changesets; the release PR would be empty."
            exit 1
          fi
