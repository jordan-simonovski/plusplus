name: release

# Opens (or updates) one "chore: release" pull request whenever changesets land on main.
# The PR runs `npm run release`: it bumps package.json, writes CHANGELOG.md, regenerates
# the landing changelog and deletes the consumed changesets. Merging it is the release:
# docker.yml then builds the image and pushes the new version tag. Nothing is published
# to npm (the package is private), so there is no publish step.
#
# Needs "Allow GitHub Actions to create and approve pull requests" (Settings > Actions >
# General). PRs opened with the Actions token don't trigger other workflows, so the go
# checks don't run on the release PR; it only changes versions and changelogs.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # HUSKY=0: CI has no use for the git hooks the prepare script installs.
      - run: npm ci
        env:
          HUSKY: "0"

      # v1 because the repo uses Changesets CLI v2 (action v2 refuses to run with it).
      # Pinned to a commit: this step holds a token that can write to the repo.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: npm run release
          commit: "chore: release"
          title: "chore: release"
