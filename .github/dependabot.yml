# Kept quiet on purpose: each ecosystem gets at most one version-update PR a month,
# bundling every update (majors too; the go workflow's tests and image build catch
# breakage), and security fixes are
# bundled per ecosystem as they come in. That's about four routine PRs a month.
# Docker covers the Dockerfile only: the DynamoDB Local digest in docker-compose.yml and
# the go workflow's integration job is updated by hand, keeping the two identical.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      go-security:
        applies-to: security-updates
        patterns: ["*"]
      go:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
      docker:
        applies-to: version-updates
        patterns: ["*"]
