services:
  dynamodb:
    # Keep in step with the integration job in .github/workflows/go.yml.
    image: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - dynamodb
    environment:
      PORT: "8080"
      AWS_REGION: ap-southeast-2
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      SLACK_SIGNING_SECRET: dev-signing-secret
      SLACK_BOT_TOKEN: xoxb-local-token
    ports:
      - "8080:8080"
